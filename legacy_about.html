<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About - PS4 WebKit Exploit</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:28px 16px;background:#0d1117;color:#e6edf3;font:17px/1.65 Arial,Helvetica,sans-serif}.container{max-width:980px;margin:auto}.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:28px}h1{font-size:30px;line-height:1.3}h2{margin-top:30px;padding-bottom:8px;border-bottom:1px solid #30363d;font-size:24px}p{color:#c8ced8}li{margin:10px 0}a{color:#58a6ff;text-decoration:none}code{padding:3px 6px;border-radius:4px;background:#21262d;font-family:monospace}pre{overflow-x:auto;padding:14px;border-radius:8px;background:#21262d}.status{text-align:center;color:#8b949e}.error{color:#ff7b72}@media(max-width:600px){body{padding:16px 10px;font-size:15px}.card{padding:20px 16px}h1{font-size:25px}h2{font-size:21px}}
</style>
</head>
<body><main class="container"><section class="card"><div id="status" class="status">Loading README.md...</div><div id="content"></div></section></main>
<script>
var README_URL="/README.md";
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#39;");}
function inline(s){var codes=[];s=esc(s);s=s.replace(/`([^`]+)`/g,function(_,x){codes.push("<code>"+x+"</code>");return "@@CODE"+(codes.length-1)+"@@";});s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank">$1</a>');s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/__([^_]+)__/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>");for(var i=0;i<codes.length;i++)s=s.replace("@@CODE"+i+"@@",codes[i]);return s;}
function render(md){var a=md.replace(/\r\n/g,"\n").split("\n"),h="",list=false,code=false,ct="";function close(){if(list){h+="</ul>";list=false;}}for(var i=0;i<a.length;i++){var l=a[i],t=l.replace(/^\s+|\s+$/g,"");if(t.indexOf("```")===0){if(!code){close();code=true;ct="";}else{h+="<pre><code>"+esc(ct)+"</code></pre>";code=false;ct="";}continue;}if(code){ct+=l+"\n";continue;}if(!t){close();continue;}if(t.indexOf("### ")===0){close();h+="<h3>"+inline(t.substr(4))+"</h3>";continue;}if(t.indexOf("## ")===0){close();h+="<h2>"+inline(t.substr(3))+"</h2>";continue;}if(t.indexOf("# ")===0){close();h+="<h1>"+inline(t.substr(2))+"</h1>";continue;}if(t.indexOf("> ")===0){close();h+="<blockquote>"+inline(t.substr(2))+"</blockquote>";continue;}if(t.indexOf("- ")===0||t.indexOf("* ")===0){if(!list){h+="<ul>";list=true;}h+="<li>"+inline(t.substr(2))+"</li>";continue;}close();h+="<p>"+inline(t)+"</p>";}close();if(code)h+="<pre><code>"+esc(ct)+"</code></pre>";return h;}
function load(){var st=document.getElementById("status"),co=document.getElementById("content"),x=new XMLHttpRequest();x.open("GET",README_URL+"?v="+new Date().getTime(),true);x.onreadystatechange=function(){if(x.readyState!==4)return;if(x.status>=200&&x.status<300){co.innerHTML=render(x.responseText);st.style.display="none";}else{st.className="status error";st.innerHTML="Unable to load README.md. Check the file path and connection.";}};x.onerror=function(){st.className="status error";st.innerHTML="Unable to load README.md. Check your internet connection.";};x.send(null);}load();
</script></body></html>
