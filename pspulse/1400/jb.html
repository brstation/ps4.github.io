<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSPULSE // 14.00-14.02 GOLDHEN</title>
<link rel="icon" type="image/png" href="../pspulse.png">
<style>
    :root {
        --bg: #151515;
        --panel: #1c1c1c;
        --panel-2: #242424;
        --line: #2e2e2e;
        --line-bright: #454545;
        --text: #f5f5f5;
        --muted: #b5b5b5;
        --dim: #828282;
        --accent: #a294ff;
        --red: #ff9b9b;
        --amber: #e1bd72;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); }
    html, body { min-height: 100%; }
    body {
        background-color: var(--bg);
        background-image: linear-gradient(rgba(162, 148, 255, .05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(162, 148, 255, .05) 1px, transparent 1px);
        background-size: 36px 36px;
        color: var(--text);
        font: 16px/1.45 Consolas, "Liberation Mono", monospace;
        min-height: 100vh;
        overflow: hidden;
    }

    .app { margin: 0 auto; padding: 14px 26px 12px; width: min(100% - 52px, 1220px); }

    /* Top status bar */
    .bar {
        align-items: center;
        border: 1px solid var(--line-bright);
        display: flex;
        font-size: 14px;
        justify-content: space-between;
        letter-spacing: .1em;
        padding: 10px 16px;
        text-transform: uppercase;
    }
    .bar b { color: var(--accent); font-weight: 400; }
    .bar-chain { color: var(--dim); }
    .bar-chain::before { color: var(--accent); content: "\25CF "; }

    #state { color: var(--accent); font-size: 22px; font-weight: 400; line-height: 1.25; margin: 18px 0 8px; }
    #msgs { color: var(--muted); font-size: 15px; margin: 0 0 10px; min-height: 20px; }
    body.done #state { color: var(--accent); }
    body.done #msgs { color: var(--accent); }
    body.fail #state { color: var(--red); }
    body.fail #msgs { color: var(--red); }
    .ok { color: var(--accent); }
    .bad { color: var(--red); }
    .warn { color: var(--amber); }

    /* chain JS scrolls this element - keep overflow and a fixed height */
    #out {
        background: var(--panel);
        border: 1px solid var(--line-bright);
        color: var(--text);
        font: inherit;
        font-size: 13px;
        line-height: 1.45;
        height: calc(100vh - 190px);
        overflow-y: auto;
        padding: 12px 14px;
        white-space: pre-wrap;
    }

    @media (max-width: 760px) {
        .app { padding: 8px 10px; width: min(100% - 20px, 560px); }
        .bar { font-size: 12px; padding: 8px 12px; }
        #state { font-size: 19px; margin: 14px 0 6px; }
        #msgs { font-size: 14px; }
        #out { height: calc(100vh - 160px); font-size: 12px; }
    }
</style>
</head>
<body>
    <div class="app">
        <header class="bar">
            <span><b>PSPULSE</b> // ps4 hosts</span>
            <span class="bar-chain">afterglow chain</span>
        </header>

        <div id="state">loading jailbreak...</div>
        <div id="msgs"></div>
        <div id="out"></div>
    </div>
<script type="module">import "./jb.js";</script>
<script>
// PSPULSE: reflect the chain result in the header.
// afterglow IS the kernel stage, so this page never reloads itself on failure:
// a miss before the kernel is entered can simply be retried by hand, and after
// it is entered only a cold console start is safe. The upstream jb.js /
// afterglow.js logic is not modified.
(function () {
    var lastMsg = "";
    var lastCls = "";
    function setState(text, cls) {
        var st = document.getElementById("state");
        if (!st) return;
        st.textContent = text;
        st.className = cls || "";
    }
    function sync() {
        try {
            var msgEl = document.getElementById("msgs");
            var msg = msgEl ? msgEl.textContent : "";
            var body = document.body;
            var cls = body ? (body.className || "") : "";

            if (msg && msg !== lastMsg) {
                lastMsg = msg;
                if (msg.indexOf("Loaded") !== -1 || msg.indexOf("Already") !== -1) {
                    setState("done — goldhen is running", "ok");
                } else if (msg.indexOf("Failed") !== -1) {
                    setState("exploit failed — close and reopen the browser", "bad");
                }
                return;
            }

            if (cls !== lastCls) {
                lastCls = cls;
                if (cls === "done") setState("done — goldhen is running", "ok");
                else if (cls === "fail") setState("exploit failed — close and reopen the browser", "bad");
            }
        } catch (e) { /* never break the exploit page */ }
    }
    setInterval(sync, 1000);
})();
</script>
</body>
</html>
