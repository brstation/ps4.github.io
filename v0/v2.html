<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PS4 Jailbreak</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #10151d;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

/* CONTEÚDO */
.wrapper {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    padding: 45px 20px 30px;
    text-align: center;
}

/* CABEÇALHO */
.header {
    margin-bottom: 38px;
}

.small {
    color: #7f8b9b;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 10px;
}

h1 {
    margin: 0;
    font-size: 40px;
    letter-spacing: 6px;
    font-weight: bold;
}

.header p {
    margin: 12px auto 0;
    max-width: 600px;
    color: #9da8b7;
    font-size: 14px;
    line-height: 1.5;
}

.line {
    width: 55px;
    height: 3px;
    margin: 18px auto 0;
    background: #fff;
}

/* CARDS */
.container {
    display: flex;
    justify-content: center;
    gap: 18px;
}

.card {
    display: block;
    position: relative;
    width: 285px;
    min-height: 255px;
    padding: 25px 18px 20px;

    background: #171e28;
    border: 1px solid #293340;
    border-radius: 14px;

    color: #fff;
    text-decoration: none;

    overflow: hidden;
}

/* Pequena barra superior */
.card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 3px;
    background: #3d4653;
}

/* Hover simples e barato */
.card:hover {
    background: #1c2531;
    border-color: #465364;
}

.card:active {
    transform: scale(0.98);
}

/* IMAGEM */
.card img {
    display: block;
    width: 90px;
    height: 90px;
    margin: 5px auto 16px;
    object-fit: contain;
}

/* TÍTULO */
.card h2 {
    margin: 0;
    font-size: 21px;
    letter-spacing: 1px;
}

/* FIRMWARE */
.version {
    display: inline-block;
    margin-top: 11px;
    padding: 6px 10px;

    background: #222b37;
    border: 1px solid #303b49;
    border-radius: 5px;

    color: #b8c1cd;
    font-size: 12px;
}

/* TEXTO INFERIOR */
.select {
    display: block;
    margin-top: 17px;

    color: #737f90;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 1.2px;
}

/* RODAPÉ */
.footer {
    margin-top: 30px;
    color: #596575;
    font-size: 10px;
    letter-spacing: 2px;
}

/* TABLETS / PS4 */
@media (max-width: 700px) {

    .wrapper {
        padding: 35px 15px 25px;
    }

    h1 {
        font-size: 34px;
        letter-spacing: 4px;
    }

    .header {
        margin-bottom: 28px;
    }

    .container {
        gap: 12px;
    }

    .card {
        width: 50%;
        min-height: 230px;
        padding: 20px 10px;
    }

    .card img {
        width: 78px;
        height: 78px;
        margin-bottom: 13px;
    }

    .card h2 {
        font-size: 18px;
    }
}

/* CELULAR */
@media (max-width: 500px) {

    .container {
        flex-wrap: wrap;
    }

    .card {
        width: calc(50% - 6px);
    }

    .card.auto {
        width: 100%;
    }

    .header p {
        font-size: 13px;
    }
}

/* CELULAR PEQUENO */
@media (max-width: 350px) {

    .wrapper {
        padding: 25px 10px;
    }

    h1 {
        font-size: 28px;
    }

    .card {
        min-height: 210px;
    }

    .card img {
        width: 68px;
        height: 68px;
    }

    .card h2 {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="wrapper">

    <header class="header">

        <div class="small">PLAYSTATION 4</div>

        <h1>JAILBREAK</h1>

        <p>
            Selecione o exploit compatível com a versão
            de firmware do seu PS4.
        </p>

        <div class="line"></div>

    </header>

    <main class="container">

        <!-- RAW GAME -->
        <a class="card auto" href="/v1/index.html">

            <img src="raw_game.png" alt="Raw Games">

            <h2>Fork Raw Game</h2>

            <span class="version">
                Firmware: 11.00 – 13.00
            </span>

            <span class="select">
                MODO OFFLINE (EM CACHE)
            </span>

        </a>

        <!-- GAMERHACK -->
        <a class="card" href="/v2/index.html">

            <img src="gamerhack.png" alt="GamerHack">

            <h2>Fork GamerHack</h2>

            <span class="version">
                Firmware: 5.05 – 13.00
            </span>

            <span class="select">
                MODO OFFLINE (EM CACHE)
            </span>

        </a>

    </main>

    <footer class="footer">
        SELECIONE SEU EXPLOIT
    </footer>

</div>

</body>
</html>
