<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS4 JB - Raw Game</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    background: #080e18;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
}

.wrapper {
    width: 100%;
    max-width: 900px;
    padding: 35px 20px;
    text-align: center;
}

/* CABEÇALHO */

.header {
    margin-bottom: 35px;
}

.small {
    color: #6fa8e8;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 8px;
}

h1 {
    margin: 0;
    font-size: 46px;
    font-weight: 300;
    letter-spacing: 7px;
}

.header p {
    margin: 12px 0 0;
    color: #8999ae;
    font-size: 14px;
}

.line {
    width: 70px;
    height: 2px;
    margin: 18px auto 0;
    background: #398de8;
}

/* CARD */

.container {
    display: flex;
    justify-content: center;
}

.card {
    position: relative;

    width: 310px;
    min-height: 290px;

    padding: 28px 20px 24px;

    display: flex;
    flex-direction: column;
    align-items: center;

    text-decoration: none;
    color: #fff;

    background: #111b29;

    border: 1px solid #263c58;
    border-radius: 10px;

    transition: transform .15s ease, border-color .15s ease;
}

.card:hover {
    transform: translateY(-5px);
    border-color: #398de8;
}

/* pequena linha azul */

.card::before {
    content: "";
    position: absolute;

    top: 0;
    left: 15%;

    width: 70%;
    height: 2px;

    background: #398de8;
}

/* IMAGEM */

.card img {
    width: 100px;
    height: 100px;

    object-fit: contain;

    margin-bottom: 18px;
}

/* TÍTULO */

.card h2 {
    margin: 0;

    font-size: 21px;
    font-weight: 400;
    letter-spacing: 1px;
}

/* FIRMWARE */

.version {
    display: inline-block;

    margin-top: 13px;
    padding: 7px 12px;

    background: #172537;
    border: 1px solid #263b55;

    border-radius: 4px;

    color: #a8b9cc;
    font-size: 12px;
}

/* BOTÃO */

.select {
    margin-top: auto;
    padding-top: 22px;

    color: #65aaff;

    font-size: 10px;
    font-weight: bold;
    letter-spacing: 1.5px;
}

/* RODAPÉ */

.footer {
    margin-top: 28px;

    color: #50647d;

    font-size: 9px;
    font-weight: bold;
    letter-spacing: 3px;
}

/* TABLET */

@media (max-width: 600px) {

    .wrapper {
        padding: 30px 15px;
    }

    h1 {
        font-size: 36px;
        letter-spacing: 5px;
    }

    .card {
        width: 290px;
        min-height: 275px;
    }

    .card img {
        width: 85px;
        height: 85px;
    }
}

/* CELULAR */

@media (max-width: 350px) {

    h1 {
        font-size: 29px;
    }

    .card {
        width: 270px;
        min-height: 255px;
    }

    .card img {
        width: 75px;
        height: 75px;
    }
}
</style>
</head>

<body>

<div class="wrapper">

    <header class="header">

        <div class="small">
            PlayStation 4
        </div>

        <h1>JAILBREAK</h1>

        <p>
            Selecione o exploit compatível com o seu firmware.
        </p>

        <div class="line"></div>

    </header>

    <main class="container">

        <a class="card" href="/v1/index.html">

            <img
                src="raw_game.png"
                alt="Raw Games"
            >

            <h2>
                Fork Raw Game
            </h2>

            <span class="version">
                Firmware: 11.00 – 13.00
            </span>

            <span class="select">
                MODO OFFLINE (EM CACHE) →
            </span>

        </a>

    </main>

    <footer class="footer">
        SELECIONE SEU EXPLOIT
    </footer>

</div>

</body>
</html>
