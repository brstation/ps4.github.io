<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4JB — PSFree Lapse</title>
<style>
  html,body{margin:0;padding:0;min-height:100%;background:#000;color:#2a9fff;
    font:15px/1.45 "Segoe UI",system-ui,sans-serif}
  #brand{text-align:center;padding:22px 12px 6px}
  #brand-title{margin:0;font-size:15px;font-weight:700;letter-spacing:.28em;
    text-transform:uppercase;color:#2a9fff}
  #brand-sub{margin:8px 0 0;font-size:13px;font-weight:600;color:#fff}
  #wrap{max-width:640px;margin:0 auto;padding:12px 16px 40px}
  #state{font-size:22px;font-weight:800;margin:12px 0;text-align:center}
  #log{white-space:pre-wrap;background:rgba(0,20,40,.7);border:1px solid rgba(42,159,255,.35);
    border-radius:6px;padding:12px;min-height:180px;max-height:55vh;overflow:auto;
    font:12px/1.4 ui-monospace,monospace;color:#9ad2ff}
  #foot{text-align:center;font-size:11px;color:#5eb6ff;margin-top:14px}
  a{color:#2a9fff}
</style>
</head>
<body>
<div id="brand">
  <p id="brand-title">PS4JB</p>
  <p id="brand-sub">PSFree + Lapse &middot; 7.00–9.60 (wired, untested here)</p>
</div>
<div id="wrap">
  <div id="state">starting...</div>
  <pre id="log"></pre>
  <p id="foot"><a href="../../index.html">back</a> &middot; from WebKitty / PSFree (AGPL)</p>
</div>
<script>
(function () {
  if (!sessionStorage.getItem("payload_path"))
    sessionStorage.setItem("payload_path", "payload.bin");
  window.log = function (msg) {
    var el = document.getElementById("log");
    if (el) el.append(String(msg) + "\n");
  };
  document.getElementById("state").textContent = "loading bundle...";
  var s = document.createElement("script");
  s.src = "bundle.js";
  s.onload = function () {
    document.getElementById("state").textContent = "running...";
    if (typeof doJailBreak === "function") {
      Promise.resolve(doJailBreak()).then(function () {
        document.getElementById("state").textContent = "Jailbreak completed successfully. You can close the browser now."; try{window.close();}catch(e){}
      }).catch(function (e) {
        document.getElementById("state").textContent = "failed";
        window.log(e && e.message ? e.message : e);
      });
    } else {
      document.getElementById("state").textContent = "doJailBreak missing";
    }
  };
  s.onerror = function () { document.getElementById("state").textContent = "failed to load bundle.js"; };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
