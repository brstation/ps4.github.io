<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Accept-CH" content="Sec-CH-UA-Model, Sec-CH-UA-Platform-Version, Sec-CH-UA-Platform">
<title>PS4JB</title>
<style>
  * { -webkit-box-sizing: border-box; box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #0a0e1a;
    background: -webkit-linear-gradient(160deg, #0a0e1a 0%, #0d1b3a 45%, #0a1628 100%);
    background: linear-gradient(160deg, #0a0e1a 0%, #0d1b3a 45%, #0a1628 100%);
    color: #e8f0ff;
    font: 15px/1.45 Arial, Helvetica, "Segoe UI", system-ui, sans-serif;
    overflow-x: hidden;
  }
  #wrap-page {
    position: relative;
    z-index: 2;
    max-width: 520px;
    margin: 0 auto;
    padding: 28px 18px 72px;
  }
  .hdr {
    text-align: center;
    margin-bottom: 22px;
  }
  #brand-title {
    margin: 0;
    font-size: 42px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #5ee7ff;
    text-shadow: 0 0 12px #1a9fff, 0 0 28px #0066cc;
  }
  #brand-sub {
    margin: 8px 0 0;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: #7a9cc8;
    text-shadow: none;
  }
  #brand-sub.blocked {
    color: #ff6473;
    text-shadow: 0 0 12px rgba(255,100,115,0.35);
  }
  .card {
    background: #121a2e;
    border: 1px solid #2a4a7a;
    -webkit-border-radius: 12px;
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 14px;
    -webkit-box-shadow: 0 0 20px rgba(0, 140, 255, 0.12), inset 0 1px 0 rgba(94, 231, 255, 0.08);
    box-shadow: 0 0 20px rgba(0, 140, 255, 0.12), inset 0 1px 0 rgba(94, 231, 255, 0.08);
  }
  .card h2 {
    margin: 0 0 10px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: #5ee7ff;
  }
  #fwMeta {
    margin: 0;
    color: #ffffff;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-shadow: 0 0 12px rgba(94, 231, 255, 0.35);
  }
  #cache {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    color: #8aa4c8;
    min-height: 20px;
  }
  #cache.cacheok { color: #3dff9a; text-shadow: 0 0 10px rgba(61, 255, 154, 0.35); }
  #stage {
    display: none;
    margin: 12px 0 0;
    font-size: 16px;
    font-weight: 700;
    color: #e8f0ff;
    text-align: left;
    text-shadow: 0 0 14px rgba(94, 231, 255, 0.35);
    width: 100%;
  }
  #stage.on { display: block; }
  #stage.ok {
    color: #3dff9a;
    text-shadow: 0 0 14px rgba(61, 255, 154, 0.55);
  }
  #stage.bad {
    color: #ff6473;
    text-shadow: 0 0 14px rgba(255,100,115,0.55);
  }
  #progress-wrap {
    display: none;
    position: relative;
    z-index: 2;
    width: 100%;
    margin: 12px 0 8px;
    height: 14px;
    -webkit-border-radius: 8px;
    border-radius: 8px;
    background: rgba(10, 20, 40, 0.85);
    border: 1px solid #2a4a7a;
    overflow: hidden;
    -webkit-box-shadow: 0 0 14px rgba(0, 140, 255, 0.18);
    box-shadow: 0 0 14px rgba(0, 140, 255, 0.18);
  }
  #progress-wrap.on { display: block; }
  #progress-bar {
    height: 100%;
    width: 0%;
    -webkit-border-radius: 8px;
    border-radius: 8px;
    background: #5ee7ff;
    background: -webkit-linear-gradient(90deg, #2ab8ff, #5ee7ff, #7ef0ff);
    background: linear-gradient(90deg, #2ab8ff, #5ee7ff, #7ef0ff);
    -webkit-box-shadow: 0 0 14px rgba(46, 184, 255, 0.55);
    box-shadow: 0 0 14px rgba(46, 184, 255, 0.55);
    -webkit-transition: background 0.35s ease, box-shadow 0.35s ease;
    transition: background 0.35s ease, box-shadow 0.35s ease;
  }
  @-webkit-keyframes ps4jb-fill {
    from { width: 0%; }
    to { width: 100%; }
  }
  @keyframes ps4jb-fill {
    from { width: 0%; }
    to { width: 100%; }
  }
  #progress-bar.run {
    -webkit-animation: ps4jb-fill 9s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    animation: ps4jb-fill 9s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
  }
  #progress-bar.finishing {
    -webkit-animation: none;
    animation: none;
    width: 100% !important;
    -webkit-transition: width 0.5s ease-out, background 0.35s ease, box-shadow 0.35s ease;
    transition: width 0.5s ease-out, background 0.35s ease, box-shadow 0.35s ease;
  }
  #progress-pct {
    display: none;
    position: relative;
    z-index: 2;
    text-align: left;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.06em;
    color: #5ee7ff;
    text-shadow: 0 0 14px rgba(46, 184, 255, 0.45);
    margin: 0 0 4px;
    width: 100%;
  }
  #progress-pct.on { display: block; }
  #elapsed {
    display: none;
    position: relative;
    z-index: 2;
    text-align: left;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #8aa4c8;
    text-shadow: none;
    margin: 0 0 4px;
    width: 100%;
  }
  #elapsed.on { display: block; }
  #successMsg {
    display: none;
    position: relative;
    z-index: 2;
    margin: 10px 0 0;
    padding: 0;
    max-width: 100%;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: #3dff9a;
    text-align: left;
    text-shadow: 0 0 16px rgba(61, 255, 154, 0.45);
    width: 100%;
  }
  #successMsg .check {
    display: inline-block;
    width: 16px;
    height: 9px;
    margin: 0 10px 3px 0;
    border-left: 3px solid #5ee7ff;
    border-bottom: 3px solid #5ee7ff;
    -webkit-transform: rotate(-45deg);
    transform: rotate(-45deg);
    vertical-align: middle;
    box-shadow: none;
    text-shadow: none;
    color: transparent;
  }
  body.done #successMsg { display: none !important; }
  body.done #stage { display: none !important; }
  body.done #progress-bar {
    background: #22c55e !important;
    background: -webkit-linear-gradient(90deg, #15803d, #22c55e, #86efac) !important;
    background: linear-gradient(90deg, #15803d, #22c55e, #86efac) !important;
    -webkit-box-shadow: 0 0 14px rgba(34, 197, 94, 0.55) !important;
    box-shadow: 0 0 14px rgba(34, 197, 94, 0.55) !important;
  }
  body.done #progress-pct { color: #86efac !important; }
  body.done #elapsed { color: #86efac !important; }
  body.fail #progress-bar {
    background: #ef4444 !important;
    background: -webkit-linear-gradient(90deg, #991b1b, #ef4444, #fca5a5) !important;
    background: linear-gradient(90deg, #991b1b, #ef4444, #fca5a5) !important;
    -webkit-box-shadow: 0 0 14px rgba(239, 68, 68, 0.55) !important;
    box-shadow: 0 0 14px rgba(239, 68, 68, 0.55) !important;
  }
  body.fail #progress-pct { color: #fca5a5 !important; }
  body.fail #elapsed { color: #fca5a5 !important; }
  body.fail #stage {
    display: block !important;
    color: #ff6473 !important;
    text-shadow: 0 0 14px rgba(255,100,115,0.55) !important;
  }
  #log-card { display: none; }
  body.log #log-card { display: block; }
  #msg, #spin, #wrap, #state, #out { display: none; }
  body.log #wrap, body.log #state, body.log #out { display: block; }
  body.log #progress-wrap,
  body.log #progress-pct,
  body.log #elapsed,
  body.log #stage,
  body.log #successMsg { display: none !important; }
  body.log #wrap { padding: 0; width: 100%; max-width: none; }
  body.log #state {
    font-size: 20px; font-weight: 700; margin: 0 0 8px; color: #5ee7ff;
  }
  body.log #out {
    white-space: pre-wrap;
    font: 12px/1.45 Consolas, monospace;
    background: #0a1424;
    border: 1px solid #1e3a5c;
    -webkit-border-radius: 8px;
    border-radius: 8px;
    padding: 10px 12px;
    height: calc(100vh - 220px);
    overflow-y: auto;
    color: #9ad2ff;
  }
  #foot {
    text-align: center;
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid #1e3050;
    font-size: 13px;
    color: #5a7398;
    letter-spacing: 0.04em;
    line-height: 1.5;
  }
  #foot b { color: #8ab4e8; font-weight: 700; }
  #foot a { color: inherit; text-decoration: none; }
  body.device-blocked #cache,
  body.device-blocked #progress-wrap,
  body.device-blocked #progress-pct,
  body.device-blocked #elapsed,
  body.device-blocked #stage,
  body.device-blocked #successMsg,
  body.device-blocked #fwMeta { display: none !important; }
  .meta {
    margin-top: 8px;
    color: #8aa4c8;
    font-size: 13px;
    line-height: 1.55;
  }
</style>
</head>
<body>
<div id="wrap-page">
  <div class="hdr">
    <p id="brand-title">PS4JB</p>
    <p id="brand-sub">6.00-12.02 · 12.50-13.52</p>
  </div>

  <div class="card">
    <h2>Firmware</h2>
    <p id="fwMeta">detecting firmware...</p>
    <div class="meta">Detected from User-Agent · Exploit chain ready when supported</div>
  </div>

  <div class="card">
    <h2>Cache / Status</h2>
    <div id="cache"></div>
    <div id="stage">Jailbreak in progress</div>
    <div id="progress-wrap" aria-hidden="true"><div id="progress-bar"></div></div>
    <div id="progress-pct">0:00</div>
    <div id="elapsed">Elapsed 0:00</div>
    <div id="successMsg" style="display:none" aria-hidden="true"></div>
  </div>

  <div class="card" id="log-card">
    <div id="spin"></div>
    <div id="msg"></div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
  </div>

  <div id="foot"><b>Developed by <a href="https://github.com/X-F1REBALL-X" target="_blank" rel="noopener">X-F1REBALL-X</a></b></div>
</div>

<script src="device.js?v=1"></script>
<script>
(function () {
  var cacheEl = document.getElementById("cache");
  var fwMeta = document.getElementById("fwMeta");
  var brandSub = document.getElementById("brand-sub");
  var stageEl = document.getElementById("stage");
  var wrapBar = document.getElementById("progress-wrap");
  var pctEl = document.getElementById("progress-pct");
  var elapsedEl = document.getElementById("elapsed");
  var jbStarted = false;

  function setCache(t, ok) {
    if (!cacheEl) return;
    cacheEl.textContent = t || "";
    cacheEl.className = ok ? "cacheok" : "";
  }

  function getParam(name) {
    var q = location.search || "";
    if (q.charAt(0) === "?") q = q.substring(1);
    var parts = q.split("&");
    for (var i = 0; i < parts.length; i++) {
      var kv = parts[i].split("=");
      if (decodeURIComponent(kv[0]) === name) {
        return kv.length > 1 ? decodeURIComponent(kv[1]) : "";
      }
    }
    return null;
  }

  var ROUTES = [
    { min: 600, max: 669, target: "chains/cssfontface/index.html", label: "CSSFontFace+Lapse", proven: false },
    { min: 670, max: 672, target: "chains/badhoist/index.html", label: "BadHoist", proven: false },
    { min: 700, max: 1102, target: "chains/cssfontface/index.html", label: "CSSFontFace+Lapse", proven: false },
    { min: 1103, max: 1202, target: "chains/slopkit/index.html", label: "Slopkit Lapse", proven: false },
    { min: 1250, max: 1300, target: "chains/slopkit/index.html", label: "Slopkit Netctrl", proven: false },
    { min: 1302, max: 1352, target: "same", label: "Slopkit Relapse", proven: true,
      only: { 1302: 1, 1304: 1, 1350: 1, 1352: 1 } }
  ];

  var ua = navigator.userAgent || "";
  var isPs4 = /PlayStation\s+4/i.test(ua);
  if (!isPs4) {
    document.body.className = (document.body.className || "") + " device-blocked";
    function showBlocked(device) {
      if (brandSub) {
        brandSub.textContent = device + " - not supported";
        brandSub.className = "blocked";
      }
      if (fwMeta) fwMeta.textContent = "";
      setCache("");
    }
    showBlocked(typeof detectDeviceFromUa === "function" ? detectDeviceFromUa(ua) : "Unknown device");
    if (typeof resolveDeviceLabel === "function") resolveDeviceLabel(ua, showBlocked);
    return;
  }

  var key = null, fwnum = null;
  var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(ua);
  if (m) {
    var ms = parseInt(m[2], 16).toString(16);
    if (ms.length < 2) ms = "0" + ms;
    key = m[1] + "." + ms;
    fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
  }
  var fromQ = getParam("fw");
  if (fromQ && /^\d+\.\d+$/.test(fromQ)) key = fromQ;

  function pickRoute(n) {
    if (n === null) return null;
    for (var i = 0; i < ROUTES.length; i++) {
      var r = ROUTES[i];
      if (n < r.min || n > r.max) continue;
      if (r.only && !r.only[n]) continue;
      return r;
    }
    return null;
  }

  var forced = getParam("force") === "1";
  var forceChain = getParam("chain");
  var route = pickRoute(fwnum);
  if (forceChain === "cssfontface") route = { target: "chains/cssfontface/index.html", label: "CSSFontFace+Lapse", proven: false };
  else if (forceChain === "psfree") route = { target: "chains/psfree-lapse/index.html", label: "PSFree+Lapse", proven: false };
  else if (forceChain === "slopkit") route = { target: "chains/slopkit/index.html", label: "Slopkit Lapse", proven: false };
  else if (forceChain === "relapse") route = { target: "same", label: "Slopkit Relapse", proven: true };
  else if (forceChain === "badhoist") route = { target: "chains/badhoist/index.html", label: "BadHoist", proven: false };

  var supported = forced || route !== null;
  if (fwMeta) {
    var bits = "FW " + (key || "?");
    if (route) bits += " · " + route.label;
    fwMeta.textContent = bits;
  }
  window.__ps4jbFw = key;

  function isSamePage(r) {
    if (!r) return true; // forced unknown -> try Relapse on this page
    return !r.target || r.target === "same" || r.target === "jb.html";
  }

  function chainUrl(r) {
    var target = (r && r.target && r.target !== "same") ? r.target : "jb.html";
    var q = location.search || "";
    target = target + q;
    if (key) target += (target.indexOf("?") >= 0 ? "&" : "?") + "fw=" + encodeURIComponent(key);
    return target;
  }

  function startProgress() {
    if (wrapBar) wrapBar.className = "on";
    if (pctEl) pctEl.className = "on";
    if (elapsedEl) elapsedEl.className = "on";
    if (stageEl) {
      stageEl.textContent = "Jailbreak in progress";
      stageEl.className = "on";
    }
    // Keep cache status visible: offline-ready tip after AppCache.

    var bar = document.getElementById("progress-bar");
    var pct = document.getElementById("progress-pct");
    if (!bar || !pct) return;
    var finished = false;
    var t0 = Date.now();
    var rafId = 0;
    var timer = 0;
    window.__ps4jbT0 = t0;

    function formatElapsed(ms) {
      var s = Math.floor(ms / 1000);
      var m = Math.floor(s / 60);
      s = s % 60;
      return m + ":" + (s < 10 ? "0" : "") + s;
    }
    // % follows the live CSS bar width (bar keeps animating even if JS stalls).
    var shownPct = 0;
    function readBarPct() {
      try {
        var wrap = bar.parentNode;
        if (!wrap) return null;
        var bw = bar.getBoundingClientRect().width;
        var ww = wrap.getBoundingClientRect().width;
        if (ww > 1) return (bw / ww) * 100;
      } catch (eR) {}
      return null;
    }
    function paintPct(v) {
      if (v < 0) v = 0;
      if (v > 100) v = 100;
      shownPct = v;
      // Text shows elapsed time, not percent.
      pct.textContent = formatElapsed((finished && window.__ps4jbElapsedMs != null) ? window.__ps4jbElapsedMs : (Date.now() - t0));
    }
    function paintElapsed(now) {
      if (!elapsedEl) return;
      elapsedEl.textContent = "";
      elapsedEl.style.display = "none";
      if (pct) pct.textContent = formatElapsed(now - t0);
    }
    function stopLoop() {
      if (timer) {
        try { clearInterval(timer); } catch (e) {}
        timer = 0;
      }
      if (rafId && typeof cancelAnimationFrame === "function") {
        try { cancelAnimationFrame(rafId); } catch (e2) {}
        rafId = 0;
      }
      window.__ps4jbElapsedMs = Date.now() - t0;
    }
    function startCssFill() {
      try {
        bar.className = "";
        bar.style.width = "0%";
        bar.style.webkitAnimation = "";
        bar.style.animation = "";
        void bar.offsetWidth;
        bar.className = "run";
      } catch (eCss) {}
    }
    function tick() {
      if (finished) return;
      var now = Date.now();
      var cls = document.body.className || "";
      if (cls.indexOf("done") !== -1) {
        complete();
        return;
      }
      if (cls.indexOf("fail") !== -1) {
        fail();
        return;
      }
      var fromBar = readBarPct();
      if (fromBar != null) paintPct(fromBar);
      paintElapsed(now);
      if ((now - t0) / 1000 > 180 && stageEl) {
        stageEl.textContent = "Jailbreak failed - restart your console";
        stageEl.className = "on bad";
        fail();
      }
    }
    function loop() {
      tick();
      if (finished) return;
      if (typeof requestAnimationFrame === "function") {
        rafId = requestAnimationFrame(loop);
      }
    }
    function complete() {
      try { if (timer) clearInterval(timer); } catch (eT) {}
      try { if (window.__ps4jbRaf) cancelAnimationFrame(window.__ps4jbRaf); } catch (eR) {}
      if (finished) return;
      finished = true;
      stopLoop();
      if (wrapBar) wrapBar.style.display = "block";
      if (pct) pct.style.display = "block";
      paintElapsed(Date.now());
      try {
        var cur = readBarPct();
        if (cur == null) cur = shownPct;
        if (cur < 1) cur = 1;
        if (cur > 99.5) {
          paintPct(100);
          bar.className = "finishing";
          bar.style.width = "100%";
        } else {
          // Continue smoothly from current width to 100% (no mid-bar freeze).
          bar.className = "";
          bar.style.webkitAnimation = "none";
          bar.style.animation = "none";
          bar.style.width = cur + "%";
          void bar.offsetWidth;
          bar.className = "finishing";
          bar.style.width = "100%";
          var end0 = Date.now();
          var startV = cur;
          function rampDone() {
            var u = (Date.now() - end0) / 500;
            if (u >= 1) {
              paintPct(100);
              return;
            }
            paintPct(startV + (100 - startV) * u);
            if (typeof requestAnimationFrame === "function") requestAnimationFrame(rampDone);
            else setTimeout(rampDone, 32);
          }
          rampDone();
        }
      } catch (eF) {
        paintPct(100);
      }
    }
    function fail() {
      if (finished) return;
      finished = true;
      stopLoop();
      if (wrapBar) wrapBar.style.display = "block";
      if (pct) pct.style.display = "block";
      try {
        document.body.classList.remove("done");
        document.body.classList.add("fail");
      } catch (eB) {}
      try {
        bar.className = "finishing";
        bar.style.width = "100%";
      } catch (eF2) {}
      paintElapsed(Date.now());
      paintPct(100);
    }
    window.__ps4jbProgressComplete = complete;
    window.__ps4jbProgressFail = fail;
    paintPct(0);
    paintElapsed(t0);
    startCssFill();
    if (typeof requestAnimationFrame === "function") {
      rafId = requestAnimationFrame(loop);
    }
    // 100ms timer keeps the clock ticking even if rAF stalls.
    timer = setInterval(tick, 100);
  }

  function startRelapse() {
    if (jbStarted) return;
    jbStarted = true;
    startProgress();
    var s = document.createElement("script");
    s.type = "module";
    s.src = "jb.js?v=40";
    s.onerror = function () {
      if (stageEl) {
        stageEl.textContent = "Jailbreak failed - restart your console";
        stageEl.className = "on bad";
      }
      if (typeof window.__ps4jbProgressFail === "function") window.__ps4jbProgressFail();
    };
    document.body.appendChild(s);
  }

  function go() {
    if (!supported) {
      if (brandSub) {
        brandSub.textContent = "no chain for this firmware";
        brandSub.className = "blocked";
      }
      return;
    }
    if (isSamePage(route) || forced) {
      startRelapse();
      return;
    }
    // Other FW chains still live in their own folders (different scripts).
    location.replace(chainUrl(route));
  }

  var ac = window.applicationCache;
  if (!ac || !document.documentElement.getAttribute("manifest")) {
    go();
  } else if (!navigator.onLine) {
    // Offline: use whatever is already cached.
    setCache("Cache ready - you can jailbreak without internet", true);
    go();
  } else if (ac.status === ac.UPDATEREADY) {
    try { ac.swapCache(); } catch (e) {}
    setCache("Cache ready - you can jailbreak without internet", true);
    location.reload();
  } else {
    // Wait for AppCache before starting the jailbreak.
    // Do NOT start on IDLE alone - PS4 WebKit often reports IDLE while
    // it is still checking/downloading, which used to launch jb.js early.
    setCache("checking cache...");
    var started = false;
    function startOnce() {
      if (started) return;
      started = true;
      go();
    }
    function markReady() {
      setCache("Cache ready - you can jailbreak without internet", true);
      startOnce();
    }
    ac.addEventListener("checking",
      function () { setCache("checking cache..."); }, false);
    ac.addEventListener("downloading",
      function () { setCache("caching for offline (first run)..."); }, false);
    ac.addEventListener("progress", function (e) {
      if (e && e.total)
        setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
    }, false);
    ac.addEventListener("cached", markReady, false);
    ac.addEventListener("noupdate", markReady, false);
    ac.addEventListener("updateready", function () {
      try { ac.swapCache(); } catch (e) {}
      setCache("Cache ready - you can jailbreak without internet", true);
      location.reload();
    }, false);
    ac.addEventListener("error", function () {
      setCache("cache unavailable");
      startOnce();
    }, false);
    ac.addEventListener("obsolete", function () {
      setCache("cache obsolete");
      startOnce();
    }, false);
    // If the check already finished before listeners attached (IDLE),
    // nudge an update so noupdate/cached will fire.
    try {
      if (ac.status === ac.IDLE || ac.status === ac.UNCACHED)
        ac.update();
    } catch (e) {}
  }
})();
</script>
