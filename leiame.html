<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About - PS4 WebKit Exploit</title>

  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --link: #58a6ff;
      --code: #21262d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.65;
    }

    .container {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 30px;
    }

    #content h1 {
      margin: 0 0 18px;
      font-size: 30px;
      line-height: 1.3;
    }

    #content h2 {
      margin: 30px 0 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      font-size: 24px;
    }

    #content h3 {
      font-size: 20px;
      margin-top: 24px;
    }

    #content p,
    #content li {
      font-size: 16px;
    }

    #content p {
      color: var(--muted);
    }

    #content ul,
    #content ol {
      padding-left: 26px;
    }

    #content li {
      margin: 12px 0;
    }

    #content a {
      color: var(--link);
      text-decoration: none;
    }

    #content a:hover,
    #content a:focus {
      text-decoration: underline;
    }

    #content code {
      background: var(--code);
      border-radius: 5px;
      padding: 3px 6px;
      font-family: Consolas, monospace;
      font-size: 0.92em;
    }

    #content pre {
      overflow-x: auto;
      padding: 16px;
      background: var(--code);
      border-radius: 8px;
    }

    #content pre code {
      padding: 0;
      background: transparent;
    }

    #content blockquote {
      margin: 16px 0;
      padding-left: 16px;
      border-left: 3px solid var(--border);
      color: var(--muted);
    }

    .status {
      color: var(--muted);
      text-align: center;
      padding: 30px 10px;
      font-size: 16px;
    }

    .error {
      color: #ff7b72;
    }

    @media (max-width: 600px) {
      body {
        padding: 16px 10px;
      }

      .card {
        padding: 20px 16px;
      }

      #content h1 {
        font-size: 25px;
      }

      #content h2 {
        font-size: 21px;
      }

      #content p,
      #content li {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <div id="status" class="status">Loading README.md...</div>
      <article id="content"></article>
    </section>
  </main>

  <script>
    // README.md located at the root of the current website.
    const README_URL = "/LEIAME.md";

    async function loadReadme() {
      const status = document.getElementById("status");
      const content = document.getElementById("content");

      try {
        const response = await fetch(README_URL + "?v=" + Date.now(), {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const markdown = await response.text();

        // Render Markdown as HTML.
        content.innerHTML = marked.parse(markdown);

        // Hide loading message after successful rendering.
        status.style.display = "none";
      } catch (error) {
        status.classList.add("error");
        status.textContent =
          "Unable to load README.md. Check your internet connection or file path.";
        console.error("README loading error:", error);
      }
    }

    loadReadme();
  </script>
</body>
</html>
