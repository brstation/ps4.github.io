<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stand PS5 Jailbreak</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background:#0b0d10 url("img/BG.jpg") center center/cover no-repeat fixed;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    #cache-status {
      position: fixed;
      top: 10px;
      right: 12px;
      left: auto;
      z-index: 9999;
      font-size: 14px;
      color: #aaa;
      text-align: right;
      pointer-events: none;
    }

    #console {
      position: relative;
      z-index: 1;
    }
  </style>
</head>

<body>
  <div id="cache-status">Vérification du cache...</div>
  <div id="console"></div>

  <script>
  (function () {
    var started = false;
    var status = document.getElementById("cache-status");
    var ac = window.applicationCache;

    function show(text) {
      status.textContent = text;
    }

    function launchScripts() {
      if (started) return;
      started = true;

      var scripts = [
        "./src/firmware.js",
        "./src/main.js",
        "./src/rop.js",
        "./src/utils/syscalls.js"
      ];

      function loadNext(index) {
        if (index >= scripts.length) {
          var moduleScript = document.createElement("script");
          moduleScript.type = "module";
          moduleScript.src = "./src/site.js";
          moduleScript.onerror = function () {
            show("Erreur de chargement : site.js");
          };
          document.body.appendChild(moduleScript);
          return;
        }

        var script = document.createElement("script");
        script.src = scripts[index];
        script.onload = function () {
          loadNext(index + 1);
        };
        script.onerror = function () {
          show("Erreur de chargement : " + scripts[index]);
        };
        document.body.appendChild(script);
      }

      loadNext(0);
    }

    if (!ac) {
      show("Cache indisponible — lancement");
      launchScripts();
      return;
    }

    ac.addEventListener("checking", function () {
      show("Vérification du cache...");
    });

    ac.addEventListener("downloading", function () {
      show("Mise en cache : 0%");
    });

    ac.addEventListener("progress", function (e) {
      if (e && e.total > 0) {
        show("Mise en cache : " +
          Math.round((e.loaded / e.total) * 100) + "%");
      } else {
        show("Mise en cache...");
      }
    });

    function ready(message) {
      show(message);
      launchScripts();
    }

    ac.addEventListener("cached", function () {
      ready("Cache prêt — lancement...");
    });

    ac.addEventListener("noupdate", function () {
      ready("Cache déjà à jour — lancement...");
    });

    ac.addEventListener("updateready", function () {
      try { ac.swapCache(); } catch (e) {}
      ready("Cache mis à jour — lancement...");
    });

    ac.addEventListener("error", function () {
      ready("Cache indisponible — lancement");
    });

    ac.addEventListener("obsolete", function () {
      ready("Cache obsolète — lancement");
    });

    if (!navigator.onLine) {
      ready("Hors ligne — lancement depuis le cache");
    } else if (
      ac.status === ac.IDLE ||
      ac.status === ac.UPDATEREADY
    ) {
      ready("Cache prêt — lancement...");
    } else {
      show("Vérification du cache...");
    }
  })();
  </script>
</body>
</html>
