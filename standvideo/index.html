<!DOCTYPE html>
<html manifest="cache.appcache" lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stand PS4 / PS5 Exploit</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-image: url('BG.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
            background-color: #121212;
        }
        #result, #user-agent {
            display: none;
        }
    </style>
</head>
<body>
    <div id="result"></div>
    <div id="user-agent"></div>
    <script>
        function processDevice() {
            const userAgent = navigator.userAgent;
            /*
             * =====================================================
             * PS4
             * =====================================================
             */
            const isPS4 = /PlayStation 4|PS4/i.test(userAgent);
            if (isPS4) {
                const fwMatch = userAgent.match(
                    /(?:PlayStation 4|PS4)[\s\/]+([\d\.]+)/i
                );
                if (fwMatch && fwMatch[1]) {
                    const firmware = parseFloat(fwMatch[1]);
                    if (firmware >= 5.00 && firmware <= 6.72) {
                        setTimeout(() => {
                            window.location.href =
                                "https://ps4.dpdns.org/standvideo/505-672/index.html";
                        }, 1500);
                    }
                    else if (firmware >= 7.00 && firmware <= 9.60) {
                        setTimeout(() => {
                            window.location.href =
                                "https://ps4.dpdns.org/standvideo/700-960/index.html";
                        }, 1500);
                    }
                    else if (firmware >= 10.00 && firmware <= 11.02) {
                        setTimeout(() => {
                            window.location.href =
                                "https://ps4.dpdns.org/standvideo/1000-1102/index.html";
                        }, 1500);
                    }
                    else if (firmware >= 11.50 && firmware <= 13.00) {
                        setTimeout(() => {
                            window.location.href =
                                "https://ps4.dpdns.org/standvideo/1150-1300/index.html";
                        }, 1500);
                    }
                     else if (firmware >= 13.02 && firmware <= 13.52) {
                        setTimeout(() => {
                            window.location.href =
                                "https://ps4.dpdns.org/standvideo/1302-1352/";
                        }, 1500);
                    }
                }
            }
            /*
             * =====================================================
             * PS5
             * =====================================================
             */
            const isPS5 = /PlayStation 5/i.test(userAgent);
            if (isPS5) {
                const fwMatch = userAgent.match(
                    /PlayStation\s*5\/([\d\.]+)/i
                );
                if (fwMatch && fwMatch[1]) {
                    const firmware = parseFloat(fwMatch[1]);
                    if (firmware >= 1.00 && firmware <= 5.50) {
                        setTimeout(() => {
                            window.location.href =
                                "https://ps4.dpdns.org/standvideo/PS5-1.00-5.50/index.html";
                        }, 1500);
                        }
                    else if (firmware >= 7.00 && firmware <= 12.70) {
                        setTimeout(() => {
                            window.location.href =
                                "https://ps4.dpdns.org/standvideo/PS5-7.00-12.70/index.html";
                        }, 1500);
                    }
                }
            }
        }
        window.onload = processDevice;
    </script>
</body>
</html>
